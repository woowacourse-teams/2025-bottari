name: deploy-dev-server-bottari

on:
  push:
    branches: main
    paths: backend/bottari/**

env:
  # 빌드/배포 공통으로 사용할 이미지 이름/태그
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bottari-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write  # GHCR push를 위해 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Jar
        working-directory: ./backend/bottari
        run: ./gradlew clean build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: ./backend/bottari
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Dev Server
    needs: build
    runs-on: [self-hosted, bottari-dev]

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image from GHCR
        run: |
          docker pull $IMAGE_NAME:$IMAGE_TAG

      - name: Run Blue-Green Deploy
        working-directory: /home/ubuntu/
        run: |
          export BOTTARI_APP_IMAGE=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          export FIREBASE_SERVICE_ACCOUNT_JSON='${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          ./deploy-app.sh
