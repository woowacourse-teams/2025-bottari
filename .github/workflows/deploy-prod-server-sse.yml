name: deploy-prod-server-sse

on:
  push:
    branches: main
    paths: backend/sse/**
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bottari-sse
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Jar
        working-directory: ./backend/sse
        run: ./gradlew clean build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: ./backend/sse
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Prod Server (SSE)
    needs: build
    runs-on: [self-hosted, bottari-prod]

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image from GHCR
        run: |
          docker pull $IMAGE_NAME:$IMAGE_TAG

      - name: Run Deploy Script
        working-directory: /home/ubuntu/
        run: |
          export BOTTARI_SSE_IMAGE=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          ./deploy-sse.sh
