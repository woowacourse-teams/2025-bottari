services:
  db:
    container_name: bottari-mysql
    image: mysql:8.0.42
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: bottari
      MYSQL_ROOT_PASSWORD: 1234
    command: ["--ngram_token_size=1"]
  redis:
    container_name: bottari-redis
    image: redis:7.4
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: 1234
    command: ["redis-server", "--requirepass", "1234"]
