spring:
  application:
    name: bottari
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
  datasource:
    master:
      hikari:
        pool-name: HIKARI-MASTER
        jdbc-url: ${WRITE_DATABASE_URL}
        username: ${WRITE_DATABASE_USERNAME}
        password: ${WRITE_DATABASE_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
    replica:
      hikari:
        pool-name: HIKARI-REPLICA
        jdbc-url: ${READ_DATABASE_URL}
        username: ${READ_DATABASE_USERNAME}
        password: ${READ_DATABASE_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        instance-profile: true
  servlet:
    multipart:
      enabled: true # 멀티파트 업로드 지원여부 (default: true)
      file-size-threshold: 0B # 파일을 디스크에 저장하지 않고 메모리에 저장하는 최소 크기 (default: 0B)
      max-file-size: 100MB # 한개 파일의 최대 사이즈 (default: 1MB)
      max-request-size: 100MB # 한개 요청의 최대 사이즈 (default: 10MB)

management:
  metrics:
    enable:
      all: false
      app.health.status: true
  cloudwatch:
    metrics:
      export:
        enabled: true
        step: 1m
        namespace: EC2/bottari-prod-api
firebase:
  service:
    key-path: ${FIREBASE_SERVICE_ACCOUNT_JSON}

app:
  s3:
    bucket: bottari-prod
