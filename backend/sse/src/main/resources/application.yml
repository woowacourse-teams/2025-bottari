spring:
  application:
    name: sse
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  port: 8081

# SSE 비동기 스레드 풀 설정
sse:
  async:
    core-pool-size: ${SSE_ASYNC_CORE_POOL_SIZE:5}
    max-pool-size: ${SSE_ASYNC_MAX_POOL_SIZE:10}
    queue-capacity: ${SSE_ASYNC_QUEUE_CAPACITY:100}
    thread-name-prefix: ${SSE_ASYNC_THREAD_NAME_PREFIX:sse-async-}
    wait-for-tasks-to-complete-on-shutdown: ${SSE_ASYNC_WAIT_FOR_TASKS:true}
    await-termination-seconds: ${SSE_ASYNC_AWAIT_TERMINATION_SECONDS:30}

bottari:
  openapi:
    server:
      url: http://localhost:8080
      description: Local
