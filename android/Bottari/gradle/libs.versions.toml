[versions]
# App Version
versionCode = "11"
versionName = "2.1.0"

# Android Gradle Plugin & Kotlin
agp = "8.9.3"
kotlin = "2.0.21"
jetbrainsKotlinJvm = "2.0.21"
kotlinxCoroutinesCore = "1.10.2"
ksp = "2.0.21-1.0.28"

# AndroidX
coreKtx = "1.16.0"
appcompat = "1.7.1"
activity = "1.10.1"
fragment = "1.8.8"
constraintlayout = "2.2.1"
work = "2.10.3"

# UI Components
coreSplashscreen = "1.0.1"
material = "1.12.0"
cardstackview = "3.0.0"
flexbox = "3.0.0"
spinkit = "1.4.0"
wheelPicker = "1.1.11"
swipeableCards = "1.1.4"

# Compose
composeBom = "2025.11.00"
composeActivity = "1.11.0"
composeLifecycle = "2.9.4"
composeRuntimeLivedata = "1.9.4"
composeMaterial3 = "1.5.0-alpha04"
composeMaterialIconsExtended = "1.7.8"
composeNavigation = "2.9.6"

# Hilt
hilt = "2.57.2"
androidxHilt = "1.3.0"
javax = "1"

# Network
retrofit = "3.0.0"
okhttp = "4.12.0"
kotlinxSerializationJson = "1.8.1"
retrofitKotlinxSerializationConverter = "1.0.0"

# Local DB
room = "2.7.2"
datastore = "1.1.7"

# Testing
junit4 = "4.13.2"
junit5 = "5.12.2"
androidxTestExtJunit = "1.2.1"
androidxTestEspresso = "3.6.1"
kotest = "5.9.1"
mockk = "1.14.4"

# Code Quality
ktlint = "13.0.0"

# Logging
timber = "5.0.1"

# Firebase
firebaseBom = "34.0.0"
googleServices = "4.4.3"
firebaseCrashlyticsGradle = "3.0.5"

[libraries]
# --- AndroidX Core ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }

# --- UI ---
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
cardstackview = { module = "com.github.jens-muenker:CardStackView", version.ref = "cardstackview" }
flexbox = { module = "com.google.android.flexbox:flexbox", version.ref = "flexbox" }
spinkit = { module = "com.github.ybq:Android-SpinKit", version.ref = "spinkit" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
wheel-picker-compose = { module = "com.github.commandiron:WheelPickerCompose", version.ref = "wheelPicker" }
swipeable-cards = { module = "com.github.smartword-app:compose-swipeable-cards", version.ref = "swipeableCards" }

# =========================
# ======= COMPOSE =========
# =========================

# --- Compose BOM ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# --- Compose Core UI ---
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }

# --- Compose Runtime ---
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

# --- Compose Material & Icons ---
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended-android", version.ref = "composeMaterialIconsExtended" }

# --- Compose Tooling / Util ---
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-util = { group = "androidx.compose.ui", name = "ui-util" }

# --- Compose Integration (Activity / Lifecycle / Navigation / Hilt) ---
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "composeActivity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "composeLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "composeLifecycle" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "composeNavigation" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }

# =========================
# ========= HILT ==========
# =========================

# --- Hilt Core ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# --- AndroidX Hilt (WorkManager 등) ---
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }

javax-inject = { module = "javax.inject:javax.inject", version.ref = "javax" }

# =========================
# ======= Network =========
# =========================

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
retrofit2-kotlinx-serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerializationConverter" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }

# =========================
# ======= Local DB ========
# =========================

androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# =========================
# ======== Logging ========
# =========================

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# =========================
# ======== Testing ========
# =========================

junit = { group = "junit", name = "junit", version.ref = "junit4" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit5" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

# =========================
# ========= Firebase ======
# =========================

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics-ndk = { module = "com.google.firebase:firebase-crashlytics-ndk" }
firebase-installations = { module = "com.google.firebase:firebase-installations" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-config = { module = "com.google.firebase:firebase-config" }

# =========================
# ======= BuildLogic ======
# =========================

android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
# --- Android Plugins ---
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# --- Kotlin Plugins ---
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# --- Code Quality Plugins ---
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

# --- Firebase ---
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
google-firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsGradle" }

# --- Covention ---
bottari-android-application = { id = "bottari.android.application", version = "unspecified" }
bottari-android-application-compose = { id = "bottari.android.application.compose", version = "unspecified" }
bottari-android-library = { id = "bottari.android.library", version = "unspecified" }
bottari-android-library-compose = { id = "bottari.android.library.compose", version = "unspecified" }
bottari-android-feature = { id = "bottari.android.feature", version = "unspecified" }
bottari-android-hilt = { id = "bottari.android.hilt", version = "unspecified" }
bottari-jvm-kotlin = { id = "bottari.jvm.kotlin", version = "unspecified" }

[bundles]
androidx-compose = [
    "androidx-compose-ui",
    "androidx-compose-foundation",
    "androidx-compose-foundation-layout",
    "androidx-compose-material3",
    "androidx-compose-material-icons-extended",
    "androidx-activity-compose",
    "androidx-compose-runtime",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-lifecycle-runtime-compose",
    "androidx-compose-ui-tooling-preview",
]

androidx-compose-navigation = [
    "androidx-navigation-compose",
    "androidx-hilt-navigation-compose",
]

androidx-compose-debug = [
    "androidx-compose-ui-tooling",
    "androidx-compose-ui-test-manifest",
]

test = [
    "junit",
    "junit-jupiter",
    "kotest-runner-junit5",
    "mockk"
]

network = [
    "retrofit",
    "logging-interceptor",
    "retrofit2-kotlinx-serialization-converter",
    "kotlinx-serialization-json",
    "okhttp-sse"
]

local = [
    "androidx-room-runtime",
    "androidx-datastore-preferences"
]
